<!DOCTYPE html>
<html lang="id" class="h-full bg-pink-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PastryFity ERP V18 - Ultra Responsive Cloud & Bluetooth POS</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f472b6; }
        
        .modal-enter { animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .hidden { display: none !important; }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
            #main-workspace { padding: 0 !important; overflow: visible !important; }
            @page { margin: 0; size: auto; }
        }
    </style>
</head>
<body class="h-full flex flex-col md:flex-row overflow-hidden text-slate-800 antialiased bg-pink-50/40">

                <h1 class="text-lg sm:text-xl font-black text-slate-900 tracking-tight leading-tight">Pastryfity Enterprise</h1>
                <p class="text-[10px] sm:text-xs font-bold text-pink-500 uppercase tracking-widest mt-1">Cloud Sync & Bluetooth POS V18</p>
            </div>
            <div class="space-y-4 text-left relative z-50">
                <label class="block text-xs font-bold text-slate-600">PIN Akses Perangkat</label>
                <input type="password" id="login-pin" maxlength="6" placeholder="••••••" inputmode="numeric" class="w-full bg-pink-50/60 border border-pink-200 rounded-xl px-4 py-3 sm:py-4 text-center text-2xl sm:text-3xl font-black tracking-widest text-slate-800 focus:ring-2 focus:ring-pink-500 outline-none transition-all">
                <button onclick="login()" class="w-full py-3.5 bg-pink-500 text-white font-bold text-sm rounded-xl hover:bg-pink-600 transition-all shadow-md active:scale-95 cursor-pointer flex justify-center items-center gap-2">

    <!-- MAIN APP WRAPPER -->
    <div id="app-view" class="flex flex-col md:flex-row w-full h-full hidden relative z-10 overflow-hidden">
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-30 md:hidden hidden transition-opacity"></div>

        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-rose-950 text-slate-300 flex flex-col justify-between flex-shrink-0 transition-transform duration-300 -translate-x-full md:translate-x-0 z-40 shadow-2xl md:shadow-none no-print">
            <div class="flex flex-col h-full">
                <div class="h-16 flex items-center justify-between px-5 border-b border-rose-900">
                    <div class="flex items-center gap-3">
                        <img src="logo.jpeg" alt="Logo" class="w-8 h-8 rounded-lg object-cover shadow-sm" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">

                <div class="p-3 border-t border-rose-900">
                    <div class="bg-rose-900/60 rounded-xl p-2.5 flex items-center gap-3 cursor-pointer hover:bg-rose-800/80 transition-all" onclick="openProfileModal()">
                        <div class="w-9 h-9 rounded-full bg-pink-600 flex items-center justify-center text-white font-black text-sm" id="sidebar-avatar">U</div>

        <main class="flex-1 flex flex-col h-full w-full overflow-hidden bg-pink-50/20 relative">

                    <div>

                <h3 class="text-base font-bold text-white" id="modal-profile-name">Name</h3>

            <div class="p-5 space-y-4 max-h-[70vh] overflow-y-auto custom-scroll">
                <form onsubmit="updateProfile(event)" class="space-y-3">
                    <div><label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nama Lengkap</label><input type="text" id="prof-nama" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none"></div>

                    <button type="submit" class="w-full py-2.5 bg-pink-500 text-white text-xs font-bold rounded-xl hover:bg-pink-600 cursor-pointer">Simpan Profil</button>

                <div class="border-t border-slate-200 pt-3">

                    <div class="space-y-2">

                        <div><label class="block text-[9px] font-bold text-slate-500">Bagian Token 2 (Akhir)</label><input type="password" id="cfg-gh-token-2" placeholder="xxxx..." class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-xs font-mono"></div>
                        <div class="grid grid-cols-2 gap-2">

            <form id="form-pos-custom" onsubmit="submitPosCustom(event)" class="space-y-3">

                    <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Nama / Tema Cake</label><input type="text" id="pc-nama" required class="w-full bg-slate-50 border border-pink-200 rounded-xl px-3 py-2 text-xs outline-none"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Jenis Cake (Base)</label><input type="text" id="pc-jenis" placeholder="Sponge, Blackforest..." required class="w-full bg-slate-50 border border-pink-200 rounded-xl px-3 py-2 text-xs outline-none"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Ukuran (Cm / Tingkat)</label><input type="text" id="pc-ukuran" required placeholder="D 20cm, T 15cm" class="w-full bg-slate-50 border border-pink-200 rounded-xl px-3 py-2 text-xs outline-none"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Model / Referensi</label><input type="text" id="pc-model" placeholder="Minimalist, 3D..." class="w-full bg-slate-50 border border-pink-200 rounded-xl px-3 py-2 text-xs outline-none"></div>
                    <div class="sm:col-span-2"><label class="block text-[10px] font-bold text-slate-500 mb-1">Caption / Tulisan di Kue</label><input type="text" id="pc-caption" placeholder="Happy Birthday..." class="w-full bg-slate-50 border border-pink-200 rounded-xl px-3 py-2 text-xs outline-none"></div>
                    <div class="sm:col-span-2"><label class="block text-[10px] font-bold text-slate-500 mb-1">Detail Ekstra Tambahan</label><textarea id="pc-detail" class="w-full bg-slate-50 border border-pink-200 rounded-xl px-3 py-2 text-xs outline-none h-16" placeholder="Krim biru, lilin 2..."></textarea></div>
                    <div><label class="block text-[10px] font-bold text-pink-600 mb-1">Harga Kesepakatan (Rp)</label><input type="number" id="pc-harga" required class="w-full bg-pink-50 border border-pink-200 text-pink-700 font-bold rounded-xl px-3 py-2 text-xs outline-none"></div>
                    <div><label class="block text-[10px] font-bold text-slate-500 mb-1">Jumlah Pesanan (Qty)</label><input type="number" id="pc-qty" value="1" required class="w-full bg-slate-50 border border-pink-200 rounded-xl px-3 py-2 text-xs outline-none"></div>
                </div>
                <div class="flex gap-2 pt-3">
                    <button type="button" onclick="document.getElementById('modal-pos-custom').classList.add('hidden')" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 text-xs font-bold rounded-xl hover:bg-slate-200">Batal</button>
                    <button type="submit" class="w-2/3 py-2.5 bg-pink-500 text-white text-xs font-bold rounded-xl hover:bg-pink-600">Simpan Ke POS</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // =========================================================================
        // 🔑 TOKEN DIBAGI MENJADI 2 BAGIAN SUPAYA BEBAS SCANNER / TERTOLAK GITHUB
        // Masukkan separuh token awal di PART_1 dan sisanya di PART_2
        // =========================================================================
        let TOKEN_PART_1 = ""; // Contoh isi: "ghp_AbCdEfGhIj"
        let TOKEN_PART_2 = ""; // Contoh isi: "KlMnOpQrStUvWxYz"

        let GITHUB_CONFIG = {
            owner: localStorage.getItem('PF_GH_OWNER') || "auraarray",
            repo: localStorage.getItem('PF_GH_REPO') || "SISTEM-ERP-PASTRYFITY",
            path: "backup_pastryfity.json",
            branch: "main"
        };

        // Fungsi otomatis menggabungkan kembali 2 bagian token saat request API
        function getGitHubToken() {
            let p1 = TOKEN_PART_1 || localStorage.getItem('PF_GH_TOKEN_P1') || "";
            let p2 = TOKEN_PART_2 || localStorage.getItem('PF_GH_TOKEN_P2') || "";
            return (p1 + p2).trim();
        }

        function saveCloudConfig() {
            let t1 = document.getElementById('cfg-gh-token-1').value.trim();
            let t2 = document.getElementById('cfg-gh-token-2').value.trim();
            let owner = document.getElementById('cfg-gh-owner').value.trim();
            let repo = document.getElementById('cfg-gh-repo').value.trim();

            if (t1) {
                localStorage.setItem('PF_GH_TOKEN_P1', t1);
                TOKEN_PART_1 = t1;
            }
            if (t2) {
                localStorage.setItem('PF_GH_TOKEN_P2', t2);
                TOKEN_PART_2 = t2;
            }
            if (owner) localStorage.setItem('PF_GH_OWNER', owner);
            if (repo) localStorage.setItem('PF_GH_REPO', repo);

            GITHUB_CONFIG.owner = owner || GITHUB_CONFIG.owner;
            GITHUB_CONFIG.repo = repo || GITHUB_CONFIG.repo;

            alert('Kredensial Cloud tersimpan aman di perangkat ini!');
            forcePullFromCloud();
        }

        // ================= DATABASE ENGINE V18 =================
        let db;
        let currentUser = null;
        let currentTab = '';
        let posCart = [];
        
        const MODULES = {
            'dashboard': { icon: '📊', label: 'Executive Dashboard', render: renderDashboard },
            'pos': { icon: '🛍️', label: 'Terminal POS & Kasir', render: renderPOS },
            'dapur': { icon: '👩‍🍳', label: 'Dapur (Stok Masuk)', render: renderDapur },
            'stok': { icon: '📦', label: 'Master Stok & Aset', render: renderStok },
            'akuntansi': { icon: '🏦', label: 'Akuntansi & HPP', render: renderAkuntansi },
            'laporan': { icon: '📑', label: 'Pusat Laporan Lengkap', render: renderLaporan },
            'invoice': { icon: '🧾', label: 'Invoice Profesional', render: renderInvoice },
            'crm': { icon: '👥', label: 'CRM & Pelanggan', render: renderCRM },
            'hrm_admin': { icon: '📋', label: 'HRM Pusat', render: renderHRMAdmin },
            'kpi': { icon: '⭐', label: 'KPI & Payroll', render: renderKPI },
            'legal': { icon: '📜', label: 'Legal Dokumen', render: renderLegal },
            'master': { icon: '⚙️', label: 'Master Control (Admin)', render: renderMaster },
            'karyawan': { icon: '📱', label: 'Portal Karyawan (ESS)', render: renderKaryawan },
            'panduan': { icon: '📖', label: 'Panduan Sistem', render: renderPanduan }
        };

        const DEFAULT_ROLES = {
            'Super Admin': Object.keys(MODULES),
            'Owner': Object.keys(MODULES),
            'Admin Toko': ['dashboard', 'pos', 'stok', 'laporan', 'crm', 'hrm_admin', 'karyawan', 'panduan'],
            'Accounting': ['dashboard', 'pos', 'stok', 'akuntansi', 'laporan', 'invoice', 'karyawan', 'panduan'],
            'Admin Gudang': ['dashboard', 'stok', 'karyawan', 'panduan'],
            'Head Dapur': ['pos', 'stok', 'dapur', 'karyawan', 'panduan'], 
            'Kasir': ['pos', 'crm', 'karyawan', 'panduan'],
            'Karyawan': ['karyawan', 'panduan']
        };

        let today = new Date();
        let firstDay = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
        let lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];
        document.getElementById('g-start').value = firstDay;
        document.getElementById('g-end').value = lastDay;
        
        initDB();

        function initDB() {
            const req = indexedDB.open('PastryFity_DB_Clean_3', 1);
            req.onupgradeneeded = (e) => {
                const u = e.target.result;
                const stores = ['users', 'roles', 'produk', 'trx', 'jurnal', 'crm', 'hrm', 'pengajuan', 'laporan', 'logs', 'stok_log', 'kpi', 'payment_acc', 'kurir', 'edit_req'];
                stores.forEach(name => {
                    let keyOptions = name === 'users' ? {keyPath: 'pin'} : (name === 'roles' ? {keyPath: 'name'} : (name === 'crm' ? {keyPath: 'hp'} : (name === 'kpi' ? {keyPath: 'nama'} : {keyPath: 'id', autoIncrement: true})));
                    if(!u.objectStoreNames.contains(name)) u.createObjectStore(name, keyOptions);
                });
            };
            req.onsuccess = (e) => { 
                db = e.target.result; 
                seedInitialData();
                setInterval(() => { autoSyncToGitHubSilent(); }, 3 * 60 * 1000);
            };
            req.onerror = () => { alert("Gagal membuka database lokal."); };
        }

        function seedInitialData() {
            const tx = db.transaction(['users', 'roles', 'payment_acc'], 'readwrite');
            const storeRoles = tx.objectStore('roles');
            for(let r in DEFAULT_ROLES) { storeRoles.get(r).onsuccess = e => { if(!e.target.result) storeRoles.put({name: r, modules: DEFAULT_ROLES[r]}); } }
            
            const storeUsers = tx.objectStore('users');
            storeUsers.get('8888').onsuccess = e => { if(!e.target.result) storeUsers.put({ pin: '8888', nama: 'Owner System', role: 'Super Admin', kontak: 'owner@pastryfity.com', alamat: '-', detail_posisi: 'CEO' }); }
            
            const storePay = tx.objectStore('payment_acc');
            storePay.getAll().onsuccess = e => {
                if(e.target.result.length === 0) {
                    storePay.put({jenis: 'Tunai Kasir', no: '-', nama: 'Kasir Utama'});
                    storePay.put({jenis: 'QRIS', no: '-', nama: 'QRIS PastryFity'});
                    storePay.put({jenis: 'Transfer Bank', no: 'BCA 123456', nama: 'PT PastryFity'});
                    storePay.put({jenis: 'Mesin EDC Debit', no: 'EDC Kasir 1', nama: 'BCA/Mandiri/BNI'});
                }
            }
        }

        // ================= CLOUD SYNC AUTOMATION =================
        async function autoSyncToGitHubSilent() {
            if (!db) return;
            try {
                const token = getGitHubToken();
                if(!token) return;

                const stores = ['users', 'roles', 'produk', 'trx', 'jurnal', 'crm', 'hrm', 'pengajuan', 'laporan', 'logs', 'stok_log', 'kpi', 'payment_acc', 'kurir', 'edit_req'];
                let backupData = {};

                for (let storeName of stores) {
                    backupData[storeName] = await new Promise((resolve) => {
                        let tx = db.transaction(storeName, 'readonly');
                        tx.objectStore(storeName).getAll().onsuccess = e => resolve(e.target.result);
                    });
                }

                const jsonContent = JSON.stringify(backupData, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(jsonContent)));
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`;

                let sha = "";
                const getFileReq = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                if (getFileReq.ok) {
                    const fileData = await getFileReq.json();
                    sha = fileData.sha;
                }

                await fetch(url, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: `Auto Sync Cloud - ${new Date().toLocaleString()}`,
                        content: encodedContent,
                        sha: sha ? sha : undefined,
                        branch: GITHUB_CONFIG.branch
                    })
                });
            } catch (err) {}
        }

        async function forcePullFromCloud() {
            const token = getGitHubToken();
            if (!token) return false;

            try {
                const url = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}?t=${new Date().getTime()}`;
                const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
                
                if (res.ok) {
                    const fileData = await res.json();
                    const jsonStr = decodeURIComponent(escape(atob(fileData.content)));
                    const cloudData = JSON.parse(jsonStr);

                    const stores = Object.keys(cloudData);
                    for (let storeName of stores) {
                        let tx = db.transaction(storeName, 'readwrite');
                        let store = tx.objectStore(storeName);
                        store.clear();
                        if (Array.isArray(cloudData[storeName])) {
                            cloudData[storeName].forEach(item => store.put(item));
                        }
                    }
                    syncApp();
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // ================= WEB BLUETOOTH PRINTER NATIVE SYSTEM =================
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        async function connectBluetoothPrinter() {
            if (!navigator.bluetooth) {
                return alert('Browser ini tidak mendukung Web Bluetooth API. Gunakan Chrome atau Edge (Android / PC).');
            }

            try {
                const dot = document.getElementById('bt-status-dot');
                const txt = document.getElementById('bt-status-text');
                
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
                });

                dot.className = "w-2 h-2 rounded-full bg-amber-500 animate-ping";
                txt.innerText = "Connecting...";

                const server = await bluetoothDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                
                for (let service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (let c of characteristics) {
                        if (c.properties.write || c.properties.writeWithoutResponse) {
                            bluetoothCharacteristic = c;
                            break;
                        }
                    }
                    if (bluetoothCharacteristic) break;
                }

                if (bluetoothCharacteristic) {
                    dot.className = "w-2 h-2 rounded-full bg-emerald-500";
                    txt.innerText = bluetoothDevice.name || "BT Connected";
                    alert(`Terhubung ke printer Bluetooth: ${bluetoothDevice.name || 'Printer Thermal'}`);
                } else {
                    throw new Error('Karakteristik cetak printer tidak ditemukan.');
                }
            } catch (error) {
                document.getElementById('bt-status-dot').className = "w-2 h-2 rounded-full bg-rose-500";
                document.getElementById('bt-status-text').innerText = "Gagal Connect";
                alert('Gagal menyambungkan Bluetooth Printer: ' + error.message);
            }
        }

        async function sendBluetoothRaw(bytes) {
            if (!bluetoothCharacteristic) return false;
            try {
                const chunkSize = 512;
                for (let i = 0; i < bytes.length; i += chunkSize) {
                    const chunk = bytes.slice(i, i + chunkSize);
                    await bluetoothCharacteristic.writeValue(chunk);
                }
                return true;
            } catch (e) {
                alert("Gagal mengirim data ke Bluetooth Printer: " + e.message);
                return false;
            }
        }

        // ================= GLOBAL HELPERS & AUTH =================
        function logActivity(action, detail) { if(currentUser) db.transaction('logs','readwrite').objectStore('logs').put({ user: currentUser.nama, pin: currentUser.pin, action, detail, ts: new Date().getTime() }); }

        async function login() {
            if(!db) return alert("Sistem sedang disiapkan. Mohon tunggu.");
            const pin = document.getElementById('login-pin').value;
            if(!pin) return;

            document.getElementById('login-btn-text').innerText = "Menarik Data Cloud...";
            await forcePullFromCloud();

            db.transaction(['users', 'roles'],'readonly').objectStore('users').get(pin).onsuccess = e => {
                if(e.target.result) {
                    currentUser = e.target.result;
                    document.getElementById('login-view').classList.add('hidden');
                    document.getElementById('app-view').classList.remove('hidden');
                    document.getElementById('sidebar-user-name').innerText = currentUser.nama;
                    document.getElementById('sidebar-user-role').innerText = currentUser.role;
                    document.getElementById('sidebar-avatar').innerText = currentUser.nama.charAt(0).toUpperCase();
                    document.getElementById('header-user-name').innerText = currentUser.nama;
                    logActivity('Login', 'Masuk ke sistem');
                    buildNavigation();
                } else {
                    document.getElementById('login-btn-text').innerText = "Autentikasi & Sync Cloud";
                    alert('PIN tidak terdaftar atau salah. Pastikan PIN sudah tersimpan di Cloud.');
                }
            };
        }

        function buildNavigation() {
            db.transaction('roles','readonly').objectStore('roles').get(currentUser.role).onsuccess = e => {
                const r = e.target.result; 
                let mods = r ? r.modules : DEFAULT_ROLES['Karyawan'];
                if(!mods.includes('karyawan')) mods.push('karyawan');
                if(!mods.includes('panduan')) mods.push('panduan');

                const nav = document.getElementById('nav-container'); nav.innerHTML = '';
                mods.forEach(m => {
                    if(MODULES[m]) {
                        nav.innerHTML += `<button onclick="navigate('${m}')" id="nav-btn-${m}" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-medium text-slate-400 hover:bg-rose-900 hover:text-pink-100 transition-all cursor-pointer"><span class="text-base">${MODULES[m].icon}</span><span>${MODULES[m].label}</span></button>`;
                    }
                });
                if(mods.length > 0) navigate(mods[0]);
            };
        }

        function navigate(tab) {
            document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('bg-pink-500', 'text-white'); b.classList.add('text-slate-400'); });
            const activeBtn = document.getElementById(`nav-btn-${tab}`);
            if(activeBtn) { activeBtn.classList.remove('text-slate-400'); activeBtn.classList.add('bg-pink-500', 'text-white'); }
            currentTab = tab;
            document.getElementById('header-title').innerText = MODULES[tab].label;
            
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebar-overlay').classList.add('hidden');
            }

            const df = document.getElementById('dash-date-filter');
            if(['dashboard','stok','akuntansi', 'laporan', 'hrm_admin', 'karyawan', 'pos'].includes(tab)) { df.classList.remove('hidden'); df.classList.add('flex'); } 
            else { df.classList.add('hidden'); df.classList.remove('flex'); }
            MODULES[tab].render();
        }

        function toRp(num) { return 'Rp ' + (num||0).toLocaleString('id-ID'); }

        // ================= DASHBOARD & MODUL KASIR =================
        function renderDashboard() {
            const ws = document.getElementById('main-workspace');
            ws.innerHTML = `
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6" id="dash-cards"></div>
                <div class="bg-white border border-pink-100 rounded-2xl shadow-xs mb-6 flex flex-col h-64 overflow-hidden">

                    </div>
                    <div class="flex-1 overflow-y-auto p-3 sm:p-4"><table id="t-dash-order" class="w-full text-left text-xs whitespace-nowrap"><thead class="bg-slate-50 text-slate-500"><tr><th class="p-2">Waktu</th><th class="p-2">Order</th><th class="p-2">Item Utama</th><th class="p-2">Total Net</th><th class="p-2">Status</th></tr></thead><tbody id="dash-order-body" class="divide-y divide-slate-50"></tbody></table></div>
                </div>
            `;

            db.transaction(['trx','jurnal'],'readonly').objectStore('trx').openCursor(null, 'prev').onsuccess = e => {
                let c = e.target.result;
                if(c) {
                    let v = c.value;

                    }

                        let tb = document.getElementById('dash-order-body');

                            tb.innerHTML += `<tr><td class="p-2 font-bold">${v.tgl} ${v.jam}</td><td class="p-2 font-bold">${v.cust}</td><td class="p-2">${fItem}</td><td class="p-2 font-bold text-pink-600">${toRp(v.net)}</td><td class="p-2">${v.stat}</td></tr>`;
                        }

                } else {
                    document.getElementById('dash-cards').innerHTML = `
                        <div class="bg-white border border-pink-100 p-4 rounded-2xl shadow-xs"><p class="text-[10px] font-bold text-slate-400 uppercase">Total Order</p><p class="text-xl font-black text-slate-800 mt-1">${toRp(o)}</p></div>

                        <div class="bg-white border border-pink-100 p-4 rounded-2xl shadow-xs"><p class="text-[10px] font-bold text-slate-400 uppercase">Piutang DP</p><p class="text-xl font-black text-amber-500 mt-1">${toRp(p)}</p></div>

                    `;

        function loadPosCategories() { renderPosGrid(); }
        function renderPosGrid() {
            const g = document.getElementById('pos-grid'); g.innerHTML = '';
            db.transaction('produk','readonly').objectStore('produk').openCursor().onsuccess = e => {

                        g.innerHTML += `<div onclick="addPosCart(${p.id}, '${p.nama}', ${p.jual}, ${p.stok}, ${p.modal}, null)" class="border border-pink-100 rounded-2xl p-2.5 cursor-pointer hover:border-pink-400 bg-white"><div class="text-xs font-bold text-slate-800">${p.nama}</div><div class="text-[10px] font-black text-slate-900 mt-1">${toRp(p.jual)}</div></div>`;

                    c.continue();
                }
            }
        }

        function addPosCart(id, nama, harga, max, modal, cdata) {
            let ex = posCart.find(i=>i.id===id);
            if(ex) { ex.qty++; } else { posCart.push({id, nama, harga, modal, qty:1, max, cdata}); }
            renderPosCart();
        }

        function renderPosCart() {
            let l = document.getElementById('pos-cart-list'); l.innerHTML = '';
            let sub = 0;
            posCart.forEach((i) => {
                sub += (i.harga * i.qty);
                l.innerHTML += `<div class="flex justify-between items-center py-2 border-b border-pink-50"><div class="text-xs font-bold">${i.nama} x ${i.qty}</div><div class="text-xs font-bold">${toRp(i.harga * i.qty)}</div></div>`;
            });
            document.getElementById('pos-sum-net').innerText = toRp(sub);
        }

            alert('Transaksi Berhasil Tersimpan.');
            posCart = []; renderPosCart();
            autoSyncToGitHubSilent();
        }

        function cetakDataKePDFA4(titleId, tableId, fileName) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF({ format: 'a4' });
            let title = document.getElementById(titleId) ? document.getElementById(titleId).innerText : 'Laporan PastryFity';
            doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("PASTRYFITY ENTERPRISE", 105, 20, {align:"center"});
            doc.setFontSize(12); doc.text(title, 105, 28, {align:"center"});
            doc.autoTable({ html: '#'+tableId, startY: 35, styles: { fontSize: 8 }, headStyles: { fillColor: [244, 114, 182] } });
            doc.save(`${fileName}.pdf`);
        }
